<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FF6B00" />
    <meta
      name="description"
      content="Boutikplus — la marketplace des jeunes du Faso : achetez et vendez en toute confiance avec paiement Mobile Money."
    />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Écran d'amorçage affiché avant l'exécution du bundle JavaScript : sans lui,
         le premier chargement affichait une longue page blanche. -->
    <style id="expo-boot-animation">
      @keyframes bp-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      #boutikplus-boot .bp-bar span {
        animation: bp-slide 1.1s ease-in-out infinite;
      }
    </style>
  </head>

  <body>
    <noscript>
      Boutikplus a besoin de JavaScript pour fonctionner. Activez-le puis rechargez la page.
    </noscript>
    <!-- Styles en ligne : ils survivent aux feuilles de style injectées par le bundle. -->
    <div id="boutikplus-boot" style="position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#ffffff 0%,#fff5ec 100%);font-family:Poppins,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1a1a2e;z-index:9999">
      <div class="bp-logo" style="width:76px;height:76px;border-radius:22px;background:#ff6b00;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(255,107,0,0.32)">B+</div>
      <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px">Boutikplus</div>
      <div style="font-size:13px;color:#6c757d">La marketplace des jeunes du Faso</div>
      <div class="bp-bar" style="width:180px;height:4px;border-radius:999px;background:#ffe1cc;overflow:hidden">
        <span style="display:block;width:40%;height:100%;border-radius:999px;background:#ff6b00"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Retire l'écran d'amorçage dès que l'application est rendue.
      (function () {
        var start = Date.now();
        var timer = setInterval(function () {
          var boot = document.getElementById('boutikplus-boot');
          if (!boot) {
            clearInterval(timer);
            return;
          }
          var root = document.getElementById('root');
          var mounted = root && root.childElementCount > 0;
          // Filet de sécurité si l'application ne monte jamais.
          if (!mounted && Date.now() - start < 20000) return;
          clearInterval(timer);
          boot.style.transition = 'opacity 220ms ease';
          boot.style.opacity = '0';
          setTimeout(function () {
            boot.parentNode && boot.parentNode.removeChild(boot);
          }, 240);
        }, 120);
      })();
    </script>
  </body>
</html>
